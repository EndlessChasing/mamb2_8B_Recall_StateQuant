[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mamb2-8b-recall-statequant"
version = "0.1.0"
description = "Packed recurrent state quantization for pure Mamba2-8B with a frozen Resurface adapter"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.6", "triton>=3.0", "sentencepiece", "datasets", "huggingface-hub", "einops"]

[tool.setuptools.packages.find]
include = ["mamba2_recall*"]
